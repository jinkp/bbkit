# Fail install if any dependency tries to run lifecycle scripts
# unless explicitly allowed below. This blocks supply-chain attacks
# like the TanStack/axios npm incidents.
strictDepBuilds: true

# Only these packages are allowed to run postinstall/install scripts.
# esbuild: downloads platform-specific binary (dev only)
# keytar: compiles native Node addon for OS keychain access
onlyBuiltDependencies:
  - esbuild
  - keytar
